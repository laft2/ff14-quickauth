[tools]
rust = "stable"
node = "lts"

[tasks.build]
description = "Tauri Windowsリリースバイナリおよびインストーラーをビルドします"
run = [
  "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prebuild.ps1",
  "cargo tauri build"
]

[tasks.install]
description = "アプリをリリースビルドし、Windowsスタートメニューにショートカットを登録します"
depends = ["build"]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/register-shortcut.ps1"

[tasks.uninstall]
description = "Windowsスタートメニューおよびスタートアップフォルダからショートカットを削除します"
run = [
  "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/unregister-shortcut.ps1",
  "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/unregister-startup.ps1"
]

[tasks."startup:enable"]
description = "Windowsのスタートアップフォルダにショートカットを追加し、ログイン時自動起動を有効化します"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/register-startup.ps1"

[tasks."startup:disable"]
description = "Windowsのスタートアップフォルダからショートカットを削除し、ログイン時自動起動を無効化します"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/unregister-startup.ps1"

[tasks."tauri:generate-key"]
description = "Tauri自動アップデート用の署名鍵ペアを生成します (tauri-key.key)"
run = "cargo tauri signer generate -w tauri-key.key"



