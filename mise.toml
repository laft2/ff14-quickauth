[tools]
rust = "stable"
node = "lts"

[tasks.build]
description = "Tauri Windowsリリースバイナリおよびインストーラーをビルドします"
run = [
  "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prebuild.ps1",
  "cargo tauri build"
]

[tasks.install]
description = "アプリをリリースビルドし、Windowsスタートメニューにショートカットを登録します"
depends = ["build"]
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/register-shortcut.ps1"

[tasks.uninstall]
description = "Windowsスタートメニューからショートカットを削除します"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/unregister-shortcut.ps1"
