[package]
name = "ff14-companion"
version = "0.1.0"
description = "FF14 Steam launcher credential companion"
authors = ["laft2 <44256206+laft2@users.noreply.github.com>"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"

# Error handling
thiserror = "2"

# TOTP generation (RFC 6238)
totp-rs = { version = "5", features = ["serde_support", "zeroize"] }

# Secure credential storage (Windows Credential Manager / DPAPI)
keyring = { version = "3", features = ["windows-native"] }

# Secure memory (zero-on-drop for passwords and seeds)
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }

# Win32 API (SendInput, SetWinEventHook, GetForegroundWindow etc.)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[dev-dependencies]
# テスト用モック
mockall = "0.13"
