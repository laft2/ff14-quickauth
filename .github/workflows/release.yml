name: "Release FF14 QuickAuth"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'バージョンの上げ方 (semver)'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# リリース処理を直列化し、同時実行によるバージョン衝突を防ぐ
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish-release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 既存タグを取得するため

      - name: Compute Next Version
        id: ver
        shell: pwsh
        run: |
          $latest = git tag --list 'v*' --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
          if (-not $latest) { $latest = 'v0.0.0' }
          $parts = ($latest -replace '^v', '').Split('.') | ForEach-Object { [int]$_ }
          switch ('${{ inputs.bump }}') {
            'major' { $next = "$($parts[0] + 1).0.0" }
            'minor' { $next = "$($parts[0]).$($parts[1] + 1).0" }
            default { $next = "$($parts[0]).$($parts[1]).$($parts[2] + 1)" }
          }
          if (git tag --list "v$next") {
            Write-Error "Tag v$next already exists."
            exit 1
          }
          Write-Host "Latest: $latest -> Next: v$next (${{ inputs.bump }})"
          "version=$next"  >> $env:GITHUB_OUTPUT
          "tag=v$next"     >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node dependencies
        run: npm ci

      - name: Inject Computed Version
        shell: powershell
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          Write-Host "Injecting version $ver into configuration files..."

          (Get-Content src-tauri/tauri.conf.json) -replace '"version":\s*"[^"]+"', "`"version`": `"$ver`"" | Set-Content src-tauri/tauri.conf.json
          (Get-Content src-tauri/Cargo.toml) -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$ver`"" | Set-Content src-tauri/Cargo.toml
          (Get-Content package.json) -replace '"version":\s*"[^"]+"', "`"version`": `"$ver`"" | Set-Content package.json
          (Get-Content index.html) -replace 'FF14 QuickAuth v[\d\.]+', "FF14 QuickAuth v$ver" | Set-Content index.html

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          shared-key: "release-cache"

      - name: Build Tauri Application & Generate NSIS Installer (.exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: 'FF14 QuickAuth ${{ steps.ver.outputs.tag }}'
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            FF14 QuickAuth の最新リリースです。
            
            - **インストーラー版 (`ff14-quickauth_..._x64-setup.exe`)**: ダブルクリックで簡単にインストールできます（スタートメニュー自動登録）。
            - **ポータブル版 (`ff14-quickauth-portable.zip`)**: 解凍してすぐ使えるインストール不要版です。
          releaseDraft: false
          prerelease: false

      - name: Create Portable Zip Package
        shell: powershell
        run: |
          $candidates = @(
            "src-tauri/target/release/ff14-quickauth.exe",
            "src-tauri/target/x86_64-pc-windows-msvc/release/ff14-quickauth.exe"
          )
          $found = $null
          foreach ($p in $candidates) {
              if (Test-Path $p) {
                  $found = $p
                  break
              }
          }
          if ($found) {
              $zipName = "ff14-quickauth-${{ steps.ver.outputs.tag }}-portable.zip"
              Compress-Archive -Path $found -DestinationPath $zipName -Force
              Write-Host "Created Portable Zip: $zipName from $found"
          } else {
              Write-Error "Executable binary not found in release target paths."
          }

      - name: Upload Portable Zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: ff14-quickauth-*-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
